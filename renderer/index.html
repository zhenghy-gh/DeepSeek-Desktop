<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'"
  />
  <title>DeepSeek Desktop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="toolbar">
    <div id="brand">
      <span class="logo">◈</span>
      <span class="name">DeepSeek Desktop</span>
    </div>
    <nav id="tabs">
      <button class="tab active" data-tab="chat">
        <img class="tab-icon" src="icons/chat.svg" alt="DeepSeek" /> DeepSeek 对话
      </button>
      <button class="tab" data-tab="harness">
        <img class="tab-icon" src="icons/harness.svg" alt="Harness" /> Harness
      </button>
    </nav>
    <div id="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">正在连接 Harness…</span>
      <span id="updateBox" class="update-box hidden">
        <button id="updateBtn" class="update-btn"></button>
      </span>
    </div>
  </header>

  <!-- 内容区由主进程的 WebContentsView 填充，仅错误面板等浮层由 DOM 承载 -->
  <main id="content">
    <div id="harness-overlay" class="overlay hidden">
      <div class="overlay-card">
        <div class="overlay-title">Harness 不可用</div>
        <div id="overlay-detail" class="overlay-detail">正在检查…</div>
        <div id="install-box" class="install-box hidden">
          <div class="install-hint">未检测到 dsh 运行时，请先安装：</div>
          <div class="install-cmd">
            <code id="install-cmd-text"></code>
            <button id="btn-copy" class="btn ghost small">复制</button>
          </div>
          <div id="install-hint-extra" class="install-hint small"></div>
        </div>
        <div class="overlay-actions">
          <button id="btn-retry" class="btn">重新启动 Harness</button>
          <button id="btn-log" class="btn ghost">查看日志</button>
        </div>
      </div>
    </div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
