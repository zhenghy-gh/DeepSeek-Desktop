name: Build Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            args: --mac dmg zip
            make_icns: true
          - os: windows-latest
            target: win
            args: --win nsis
            make_icns: false
          - os: ubuntu-latest
            target: linux
            args: --linux AppImage deb
            make_icns: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成图标
        run: node scripts/gen-icon.mjs
      - if: matrix.make_icns
        name: 生成 macOS icns
        run: bash scripts/make-icns.sh

      - name: 准备内置 dsh 运行时
        run: node scripts/prepare-runtime.mjs

      - name: 构建安装包
        run: npx electron-builder ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
